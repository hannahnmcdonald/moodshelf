services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: moodshelf
      POSTGRES_PASSWORD: moodshelf
      POSTGRES_DB: moodshelf
    ports:
      - "5433:5432"
    volumes:
      - moodshelf-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodshelf -d moodshelf"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moodshelf-db-data:
